  <!-- Guard against Flutter Web negative ViewInsets assertion when zooming or using DevTools Device Mode -->
  <script>
    (function() {
      try {
        if (typeof VisualViewport !== 'undefined' && VisualViewport.prototype) {
          var heightDesc = Object.getOwnPropertyDescriptor(VisualViewport.prototype, 'height');
          if (heightDesc && heightDesc.get) {
            var origHeight = heightDesc.get;
            Object.defineProperty(VisualViewport.prototype, 'height', {
              get: function() {
                var h = origHeight.call(this);
                var maxH = window.innerHeight;
                return (maxH && h > maxH) ? maxH : h;
              },
              configurable: true,
              enumerable: true
            });
          }
          var widthDesc = Object.getOwnPropertyDescriptor(VisualViewport.prototype, 'width');
          if (widthDesc && widthDesc.get) {
            var origWidth = widthDesc.get;
            Object.defineProperty(VisualViewport.prototype, 'width', {
              get: function() {
                var w = origWidth.call(this);
                var maxW = window.innerWidth;
                return (maxW && w > maxW) ? maxW : w;
              },
              configurable: true,
              enumerable: true
            });
          }
        }
      } catch (e) {
        // Non-blocking fallback
      }
    })();
  </script>
