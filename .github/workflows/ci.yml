name: CI - Backend & Frontend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for modified files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'render.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-render.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-apk.yml'

  backend-tests:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: attendhub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/attendhub_test
          JWT_SECRET: test_jwt_secret_key_for_ci_only
          REFRESH_TOKEN_SECRET: test_refresh_secret_key_for_ci_only
          ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
          REFRESH_TOKEN_EXPIRE_DAYS: "60"
        run: |
          python -m pytest tests/ -v --tb=short --color=yes --cov=app --cov-report=term-missing --cov-fail-under=70

  flutter-tests:
    name: Flutter Tests & Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --reporter compact --coverage

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  lint-and-format:
    name: Python Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install Python linting tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python code formatting (black)
        working-directory: backend
        continue-on-error: true
        run: black --check --diff app/ tests/ || echo "Black formatting issues found (non-blocking)"

      - name: Check Python imports (isort)
        working-directory: backend
        continue-on-error: true
        run: isort --check-only --diff app/ tests/ || echo "Import order issues found (non-blocking)"

      - name: Lint Python code (flake8)
        working-directory: backend
        continue-on-error: true
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503 || echo "Flake8 issues found (non-blocking)"

  build-check:
    name: Mobile Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [detect-changes, flutter-tests]
    if: ${{ needs.detect-changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: "mobile/android/**/*.gradle*"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure Android Gradle wrapper
        working-directory: mobile
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
            printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties
            gradle -p android wrapper --gradle-version 8.12
          fi
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter APK (debug)
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL="https://api.example.com/api/v1"

      - name: Verify APK was built
        run: |
          if [ ! -f mobile/build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          ls -lh mobile/build/app/outputs/flutter-apk/app-debug.apk

  all-checks-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-tests, flutter-tests, lint-and-format, build-check]
    if: always()

    steps:
      - name: Verify scheduled jobs succeeded
        run: |
          echo "Checking job results..."
          for job in "backend-tests:${{ needs.backend-tests.result }}" \
                     "flutter-tests:${{ needs.flutter-tests.result }}" \
                     "lint-and-format:${{ needs.lint-and-format.result }}" \
                     "build-check:${{ needs.build-check.result }}"; do
            name=$(echo "$job" | cut -d: -f1)
            result=$(echo "$job" | cut -d: -f2)
            echo "Job $name: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Error: Required job $name failed with status: $result"
              exit 1
            fi
          done
          echo "✅ All scheduled CI checks succeeded or were safely skipped!"
