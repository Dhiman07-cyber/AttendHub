name: Build & Release Android APK

on:
  # 1. Trigger automatically on push to main (filtered to mobile changes) or version tags
  push:
    branches:
      - main
    tags:
      - "v*"

  # 2. Build when a Release or Pre-release is published in GitHub UI
  release:
    types: [published]

  # 3. Allow manual one-click release from GitHub Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.0 or v1.0.1)"
        required: true
        default: "v1.0.1"
        type: string
      release_title:
        description: "Release title (optional, defaults to AttendiFy <tag>)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as Pre-release"
        required: true
        default: false
        type: boolean
      api_base_url:
        description: "Backend API Base URL"
        required: true
        default: "https://attendify-li14.onrender.com/api/v1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release-trigger:
    name: Check Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files for mobile
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/release-apk.yml'

      - name: Determine if release build is required
        id: check
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          MOBILE_CHANGED="${{ steps.filter.outputs.mobile }}"

          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "release" ] || [[ "$REF" == refs/tags/v* ]]; then
            echo "Explicit release or version tag triggered: Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ "$MOBILE_CHANGED" = "true" ]; then
            echo "Push to main modified mobile files: Proceeding with release build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Push did not modify mobile files: Skipping release APK build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build & Publish AttendiFy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-release-trigger]
    if: ${{ needs.check-release-trigger.outputs.should_build == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag_name }}
          DISPATCH_TITLE: ${{ inputs.release_title }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_API_URL: ${{ inputs.api_base_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            TITLE="$DISPATCH_TITLE"
            PRERELEASE="$DISPATCH_PRERELEASE"
            API_URL="$DISPATCH_API_URL"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            TITLE="$RELEASE_TITLE"
            PRERELEASE="$RELEASE_PRERELEASE"
            API_URL="https://attendify-li14.onrender.com/api/v1"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE=""
            if [[ "$TAG" == *"-"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            API_URL="https://attendify-li14.onrender.com/api/v1"
          else
            # Pushed to main branch
            PUBSPEC_VER=$(grep '^version:' mobile/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1 | tr -d ' \r\n')
            if [ -n "$PUBSPEC_VER" ]; then
              TAG="v${PUBSPEC_VER}"
            else
              TAG="v1.0.1"
            fi
            TITLE="AttendiFy ${TAG}"
            PRERELEASE="true"
            API_URL="https://attendify-li14.onrender.com/api/v1"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH[-suffix]." >&2
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            echo "API base URL cannot be empty." >&2
            exit 1
          fi

          if [ -z "$TITLE" ]; then
            TITLE="AttendiFy ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: "mobile/android/**/*.gradle*"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure Android Gradle wrapper
        working-directory: mobile
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
            printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties
            gradle -p android wrapper --gradle-version 8.12
          fi
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ steps.meta.outputs.api_url }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Prepare release assets & SHA-256 checksums
        working-directory: mobile/build/app/outputs/flutter-apk
        shell: bash
        run: |
          cp app-release.apk AttendiFy.apk
          cp app-release.apk "AttendiFy-${{ steps.meta.outputs.tag }}.apk"
          sha256sum AttendiFy.apk "AttendiFy-${{ steps.meta.outputs.tag }}.apk" > SHA256SUMS.txt
          ls -lh AttendiFy*.apk SHA256SUMS.txt

      - name: Upload APK to GitHub Actions Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendiFy-${{ steps.meta.outputs.tag }}-apk
          path: |
            mobile/build/app/outputs/flutter-apk/AttendiFy.apk
            mobile/build/app/outputs/flutter-apk/AttendiFy-${{ steps.meta.outputs.tag }}.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            mobile/build/app/outputs/flutter-apk/AttendiFy.apk
            mobile/build/app/outputs/flutter-apk/AttendiFy-${{ steps.meta.outputs.tag }}.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}