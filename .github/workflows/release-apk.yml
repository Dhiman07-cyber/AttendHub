name: Build & Release Android APK

on:
  # 1. Trigger automatically when a version tag is pushed (e.g., git tag v1.0.1 && git push origin v1.0.1)
  push:
    tags:
      - "v*"

  # 2. Trigger when a Release or Pre-release is created/published in the GitHub UI
  release:
    types: [created, published]

  # 3. Allow manual one-click release from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.0 or v1.0.1)"
        required: true
        default: "v1.0.1"
        type: string
      release_Title:
        description: "Release title (optional, defaults to AttendiFy <tag>)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as Pre-release"
        required: true
        default: false
        type: boolean
      api_base_url:
        description: "Backend API Base URL"
        required: true
        default: "https://attendify-li14.onrender.com/api/v1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish AttendiFy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_Title }}"
            PRERELEASE="${{ inputs.prerelease }}"
            API_URL="${{ inputs.api_base_url }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
            API_URL="https://attendify-li14.onrender.com/api/v1"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
            if [[ "$TAG" == *"-"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            API_URL="https://attendify-li14.onrender.com/api/v1"
          fi

          if [ -z "$TITLE" ]; then
            TITLE="AttendiFy ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: "mobile/android/**/*.gradle*"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter test suite
        working-directory: mobile
        run: flutter test --reporter compact

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api_url }}

      - name: Prepare release assets & SHA-256 checksums
        working-directory: mobile/build/app/outputs/flutter-apk
        shell: bash
        run: |
          cp app-release.apk AttendiFy.apk
          cp app-release.apk "AttendiFy-${{ steps.meta.outputs.tag }}.apk"
          sha256sum AttendiFy.apk "AttendiFy-${{ steps.meta.outputs.tag }}.apk" > SHA256SUMS.txt
          ls -lh AttendiFy*.apk SHA256SUMS.txt

      - name: Upload APK to GitHub Actions Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendiFy-${{ steps.meta.outputs.tag }}-apk
          path: |
            mobile/build/app/outputs/flutter-apk/AttendiFy.apk
            mobile/build/app/outputs/flutter-apk/AttendiFy-${{ steps.meta.outputs.tag }}.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            mobile/build/app/outputs/flutter-apk/AttendiFy.apk
            mobile/build/app/outputs/flutter-apk/AttendiFy-${{ steps.meta.outputs.tag }}.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
