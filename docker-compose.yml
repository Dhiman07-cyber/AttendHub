version: "3.8"

services:
  # AttendHub FastAPI Backend Service (Points to Cloud Supabase PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendhub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-60}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - LOCAL_STORAGE_DIR=/app/storage_uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/storage_uploads
    networks:
      - attendhub_net

volumes:
  backend_uploads:
    driver: local

networks:
  attendhub_net:
    driver: bridge
