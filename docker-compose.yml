version: "3.8"

services:
  # AttendHub FastAPI Backend Service (Points to Cloud Supabase PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendhub-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:y4l7B7E9YQig0ALt@db.vaoesgmcrzywmkhbjqvq.supabase.co:5432/postgres}
      - SUPABASE_URL=${SUPABASE_URL:-https://vaoesgmcrzywmkhbjqvq.supabase.co}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_iScYs-Oz5_0GQrgbiYINIw_HYa05sBU}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://vaoesgmcrzywmkhbjqvq.supabase.co}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_iScYs-Oz5_0GQrgbiYINIw_HYa05sBU}
      - JWT_SECRET=${JWT_SECRET:-attendhub_prod_jwt_secret_key_replace_before_public_release_2026}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-attendhub_prod_refresh_secret_key_replace_before_public_release_2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - LOCAL_STORAGE_DIR=/app/storage_uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/storage_uploads
    networks:
      - attendhub_net

volumes:
  backend_uploads:
    driver: local

networks:
  attendhub_net:
    driver: bridge
